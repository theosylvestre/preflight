name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vscode:
    name: core + VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm --filter @preflight/core test
      - run: xvfb-run -a pnpm --filter preflight-tf-aws test

  jetbrains:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (unit, platform, bridge)
        working-directory: jetbrains
        run: ./gradlew check buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-jetbrains
          path: jetbrains/build/distributions/*.zip
