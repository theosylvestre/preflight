name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vscode:
    name: core + VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm --filter @preflight/core test
      - run: xvfb-run -a pnpm --filter preflight-tf-aws test
