pluginGroup = io.github.theosylvestre.preflight
pluginVersion = 0.2.0

# Oldest supported IDE build (2025.1), and the IDEs the plugin is built and run against.
pluginSinceBuild = 251
platformVersion = 2025.1.7.2
pycharmVersion = 2025.1.6.2

# Node.js used to build the webview bundle of ../core and to test the page side of the bridge.
nodeExecutable = node

# Optional: path of an installed IDE for `runLocalIde`, e.g. in ~/.gradle/gradle.properties:
# localIde = /Applications/IntelliJ IDEA.app

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g
